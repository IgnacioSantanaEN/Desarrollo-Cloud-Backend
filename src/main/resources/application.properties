# Nombre de la aplicación
spring.application.name=Azure

# Propiedades Azure
spring.cloud.azure.active-directory.enabled=true
spring.cloud.azure.active-directory.profile.tenant-id=a24980c7-d61a-48af-a515-e3c44be91c48
spring.cloud.azure.active-directory.credential.client-id=a24980c7-d61a-48af-a515-e3c44be91c48
spring.cloud.azure.active-directory.app-id-uri=api://a24980c7-d61a-48af-a515-e3c44be91c48

# Propiedades RabbitMQ
spring.rabbitmq.addresses=localhost:5672,localhost:5673
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin123
spring.rabbitmq.virtual-host=/

spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.initial-interval=1000
spring.rabbitmq.template.retry.max-interval=30000
spring.rabbitmq.template.retry.multiplier=2.0

# Configuración Apache Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=grupo-cloud-native
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

# Si usas Kafka Streams:
spring.kafka.streams.application-id=cloud-native-streams-app