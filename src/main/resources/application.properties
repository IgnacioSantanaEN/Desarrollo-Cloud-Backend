# Nombre de la aplicación
spring.application.name=Azure

# Propiedades Azure
spring.cloud.azure-directory.enabled=true
spring.cloud.azure-directory.credential.client-id=a24980c7-d61a-48af-a515-e3c44be91c48
spring.cloud.azure-directory.credential.app-id-uri=api://a24980c7-d61a-48af-a515-e3c44be91c48

# Propiedades RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/

spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.initial-interval=1000
spring.rabbitmq.template.retry.max-interval=30000
spring.rabbitmq.template.retry.multiplier=2.0