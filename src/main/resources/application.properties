# Nombre de la aplicación
spring.application.name=Azure

# Propiedades Azure
spring.cloud.azure.active-directory.enabled=true
spring.cloud.azure.active-directory.profile.tenant-id=a24980c7-d61a-48af-a515-e3c44be91c48
spring.cloud.azure.active-directory.credential.client-id=a24980c7-d61a-48af-a515-e3c44be91c48
spring.cloud.azure.active-directory.app-id-uri=api://a24980c7-d61a-48af-a515-e3c44be91c48

# Propiedades RabbitMQ
spring.rabbitmq.addresses=localhost:5672,localhost:5673
# spring.rabbitmq.port=5672
# Ya no es necesario port debido a que addresses ya contiene los puertos de los nodos del cluster 
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin123
spring.rabbitmq.virtual-host=/

spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.initial-interval=1000
spring.rabbitmq.template.retry.max-interval=30000
spring.rabbitmq.template.retry.multiplier=2.0